name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatage (Prettier)
        run: npx prettier --check .
      - name: Lint (ESLint)
        run: npm run lint
      - name: Types (TypeScript)
        run: npm run typecheck
      - name: Tests (Vitest)
        run: npm test

  e2e:
    name: Build de production et tests e2e
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium
      # Build de production branché sur le faux TMDB (e2e/mock-tmdb) :
      # aucune clé ni accès réseau à TMDB nécessaires.
      - name: Tests e2e (Playwright)
        run: npx playwright test
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
